plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kayago'
    compileSdk 34

    defaultConfig {
        applicationId "com.kayago"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    // 仓库内自带的演示用签名（密码见 README）。
    // 若要上架应用商店，请替换为你自己的 keystore。
    signingConfigs {
        release {
            storeFile file("../keystore/kayago-release.jks")
            storePassword "kayago2026"
            keyAlias "kayago"
            keyPassword "kayago2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 应用本体零第三方依赖。这里的 junit 只用于单元测试，不进 APK。
    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
}
